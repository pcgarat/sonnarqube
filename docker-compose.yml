version: '3.8'

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-15-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-sonarqube}_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonar}
      POSTGRES_DB: ${POSTGRES_DB:-sonar}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - sonarqube-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonar} -d ${POSTGRES_DB:-sonar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sonarqube:
    image: sonarqube:${SONARQUBE_VERSION:-lts-community}
    container_name: ${COMPOSE_PROJECT_NAME:-sonarqube}_sonarqube
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sonar}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-sonar}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: ${SONAR_ES_BOOTSTRAP_CHECKS_DISABLE:-true}
      SONAR_WEB_JAVAADDITIONALOPTS: ${SONAR_WEB_JAVAADDITIONALOPTS:--Xmx512m -Xms128m}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_conf:/opt/sonarqube/conf
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    networks:
      - sonarqube-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:${SONAR_SCANNER_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-sonarqube}_scanner
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/usr/src
    networks:
      - sonarqube-network
    profiles:
      - scanner
    command: ["tail", "-f", "/dev/null"]
    restart: "no"

volumes:
  sonarqube_data:
    driver: local
  sonarqube_logs:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_conf:
    driver: local
  postgres_data:
    driver: local

networks:
  sonarqube-network:
    driver: bridge

